name: ImasLiveDB
options:
  bundleIdPrefix: com.fugaif
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: ja

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

# 版はここ 1 箇所だけ。ターゲットごとに書くと必ずずれる — 実際、fastlane の
# 書き戻しが `sub!` (最初の 1 件だけ置換) だったため、本体が 53 に上がっても
# ウィジェット拡張は 46 のまま取り残されていた (App Store 提出時に
# 「app extension の CFBundleVersion は本体と一致していること」で弾かれる)。
settings:
  base:
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "64"

targets:
  ImasLiveDB:
    type: application
    platform: iOS
    sources:
      - path: ImasLiveDB
        excludes:
          - Resources/master.sqlite
          - Resources/master.sqlite-shm
          - Resources/master.sqlite-wal
          # データ更新時に Resources に残る DB バックアップ (master.sqlite.bak_*) は
          # アプリに同梱しない。放置すると 1 件 ~18MB が積み上がり .app が肥大化する。
          - Resources/*.bak*
          # CloudKit スキーマのメモ (コード隣のドキュメント) もバンドル不要。
          - Services/README_CloudKit_Schema.md
          - Resources/v7_event_kind_data.sql
          - PrivacyInfo.xcprivacy
          - Resources/GoogleService-Info.plist
      - path: ImasLiveDB/Resources/master.sqlite
        optional: true
        buildPhase: resources
      - path: ImasLiveDB/Resources/v7_event_kind_data.sql
        buildPhase: resources
      - path: ImasLiveDB/Resources/GoogleService-Info.plist
        # gitignore 対象 (Firebase の秘匿ファイル) なので CI や新規 clone には無い。
        # master.sqlite と同じく optional にしておかないと xcodegen が spec 検証で落ちる。
        optional: true
        buildPhase: resources
      - path: ImasLiveDB/PrivacyInfo.xcprivacy
        buildPhase: resources
      # P名刺の名前の書体 (iOS / Android / Web で同じもの。作り方は tools/build_card_name_fonts.py)。
      # 使用許諾 (SIL OFL 1.1) の全文 OFL-*.txt も一緒に同梱する。
      - path: fonts/card-name
        buildPhase: resources
      # imas-core (Rust) の UniFFI 生成バインディング。imas-core/build.sh が再生成する
      - path: build/imas-core/swift/imas_core.swift
        group: ImasCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: GQ3WP34LFW
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.fugaif.ImasLiveDB
        PRODUCT_NAME: ImasLiveDB
        INFOPLIST_KEY_CFBundleDisplayName: アイドルライブDB
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ja
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "楽曲のジャケット写真の表示とプレビュー再生に使用します"
        INFOPLIST_KEY_NSCameraUsageDescription: "セットリストの写真から曲名を読み取るときと、P名刺の QR や紙の名刺を読み取るときに使用します"
        # P名刺の交換で、近くの iPhone に担当の画像を直接送る (MultipeerConnectivity)。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "P名刺を交換するとき、近くの iPhone に担当の画像を直接送るために使用します"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "セットリストの写真を選択してOCRで曲名を認識します"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ティアー表の画像を写真に保存します"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "イントロドンで曲名を音声で答えるために使用します"
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "ライブの予定をカレンダーに追加するために使用します"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "お手持ちのカレンダーの予定をアプリ内のスケジュールに重ねて表示するために使用します"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "発声した曲名をテキスト化してクイズに回答するために使用します"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 歌詞プレイヤーの「いま歌っている行」をロック画面に出す (LyricsLiveActivityController)。
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
    # custom URL scheme (imaslivedb://) は INFOPLIST_KEY_* では表現できないため
    # info ブロックで Info.plist を生成する。GENERATE_INFOPLIST_FILE: YES と併用すると
    # Xcode が INFOPLIST_KEY_* をこのファイルへマージする。
    # CFBundleShortVersionString / CFBundleVersion は xcodegen のデフォルト ("1.0"/"1")
    # に固定されないようビルド設定変数を明示する。
    info:
      path: ImasLiveDB/Info.plist
      properties:
        # 起動画面。無地の自動生成 (UILaunchScreen_Generation) だとダークモードで
        # 真っ黒になり、初回起動の DB 準備中に「壊れた?」と不安にさせるため、
        # アプリアイコンを中央に置いた画面にする。背景はアプリ本体と同じ色。
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
          UIColorName: LaunchBackground
        # P名刺の名前の書体 (fonts/card-name/。名前の一覧はコアの cardNameFonts の fileStem)。
        UIAppFonts:
          - card_name_gothic.ttf
          - card_name_mincho.ttf
          - card_name_pop.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.fugaif.ImasLiveDB
            CFBundleURLSchemes:
              - imaslivedb
        # P名刺の近くの端末への直接の受け渡し (MultipeerConnectivity の service type "imascard")。
        # 配列なので INFOPLIST_KEY_* では書けない。
        NSBonjourServices:
          - _imascard._tcp
          - _imascard._udp
        # 名刺ファイル (.imascard)。名乗り (拡張子・MIME・UTI) はコアの cardFileTypeInfo と同じ値。
        # AirDrop / Quick Share で届いたファイルを「このアプリで開く」で受け取る。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fugaif.imaslivedb.card
            UTTypeDescription: P名刺
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - imascard
              public.mime-type:
                - application/vnd.imaslivedb.card
        CFBundleDocumentTypes:
          - CFBundleTypeName: P名刺
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.fugaif.imaslivedb.card
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: ImasLiveDB/ImasLiveDB.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:imas-live-api.tokata3011.workers.dev
          # P名刺の URL (https://idollivedb.fugaapp.site/p/#…)。AASA は Web 側 (web/public) が置く。
          - applinks:idollivedb.fugaapp.site
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.fugaif.ImasLiveDB
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups:
          - group.com.fugaif.ImasLiveDB
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Firebase
        product: FirebaseAnalytics
      # imas-core (Rust): imas-core/build.sh で生成。
      # Apple では rusqlite が system SQLite とリンクするため libsqlite3 を明示
      # (bundled を静的リンクすると GRDB まで同梱 SQLite に乗っ取られる — Cargo.toml 参照)
      - framework: build/imas-core/ImasCore.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - target: ImasLiveDBWidget
    scheme:
      testTargets:
        - ImasLiveDBTests

  ImasLiveDBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImasLiveDBTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: GQ3WP34LFW
        PRODUCT_BUNDLE_IDENTIFIER: com.fugaif.ImasLiveDBTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: ImasLiveDB

  ImasLiveDBWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ImasLiveDBWidget
      - path: ImasLiveDB/Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: GQ3WP34LFW
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.fugaif.ImasLiveDB.widget
        PRODUCT_NAME: ImasLiveDBWidget
        INFOPLIST_KEY_CFBundleDisplayName: 担当ウィジェット
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
    info:
      path: ImasLiveDBWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ImasLiveDBWidget/ImasLiveDBWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fugaif.ImasLiveDB
