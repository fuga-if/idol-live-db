name: Missing songs

# 新曲の漏れチェック。登録済みの曲の歌い手の Apple Music の新しい配信と、ファンの曲一覧
# (アイドルマスター楽曲メモ) を db/master.sql と突き合わせ、DB に無い曲を 1 曲 1 issue
# (edit-request + missing-song) にする。毎日の収集 (0:05 JST の daily-data-crawl) が
# edit-request の issue を読んで取り込むので、その前 (20:07 JST) に走らせる。
#
# ミリシタのイベント曲・シャニソンの実装曲などは公式ニュースに出ず、収集から漏れていた
# (2026-11 のハピピス♡ など)。
on:
  schedule:
    # GitHub の schedule は混むと数時間遅れる (初回 23:40 予定が 6:00 に動いた)。
    # 0:05 の収集に間に合うよう、余裕をもって夕方に回す。毎時 0 分を避ける。
    - cron: "7 11 * * *" # 20:07 JST
  workflow_dispatch:
    inputs:
      days:
        description: "Apple Music の配信日を何日さかのぼるか (既定 30)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: missing-songs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false

      - name: Find unregistered songs
        env:
          DAYS: ${{ inputs.days || '30' }}
        run: |
          python3 tools/find_unregistered_releases.py --days "$DAYS" --json > "$RUNNER_TEMP/candidates.json"
          python3 -c "import json,sys; [print(c['title']) for c in json.load(open(sys.argv[1]))]" "$RUNNER_TEMP/candidates.json"

      - name: File issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create missing-song --color FBCA04 --description "新曲の漏れチェックが見つけた未登録の曲" 2>/dev/null || true
          python3 tools/file_missing_song_issues.py "$RUNNER_TEMP/candidates.json"
