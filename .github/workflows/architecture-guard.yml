name: Architecture Guard

# Hexagonal Architecture (docs/ARCHITECTURE.md) の依存方向を機械的にガードする。
# Domain 層 (ImasLiveDB/Domain/) は SwiftUI/GRDB/CloudKit を import してはいけない。
# import があれば tools/check_domain_purity.sh が exit 1 になり、このジョブを落とす。
on:
  push:
    branches: [main, develop]
    paths:
      - 'ImasLiveDB/Domain/**'
      - 'tools/check_domain_purity.sh'
  pull_request:
    paths:
      - 'ImasLiveDB/Domain/**'
      - 'tools/check_domain_purity.sh'
  workflow_dispatch:

# GITHUB_TOKEN は既定で読み取りのみ (書き込みが要るジョブは個別に足す)。
permissions:
  contents: read

jobs:
  domain-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check Domain purity (no SwiftUI/GRDB/CloudKit import)
        run: |
          chmod +x tools/check_domain_purity.sh
          ./tools/check_domain_purity.sh
