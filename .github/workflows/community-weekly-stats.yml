name: Community weekly stats

# 終わった週の再生回数とお気に入り数を、週に 1 枚ずつ残す (週次チャートの材料)。
# D1 は今週・先週しか持たないので、1 週間止まるとその週は取り返せない。
# bot/community-stats は追記履歴を保持し、develop への取り込みを待たず蓄積する。
on:
  schedule:
    - cron: "23 15 * * *" # 毎日 00:23 JST。再生回数は遅れて届く分があるので毎日取り直す
  workflow_dispatch:

concurrency:
  group: community-weekly-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Open stats archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --exit-code の 2 だけがブランチ未作成。通信・認証失敗を初回扱いしない。
          gh auth setup-git
          result=0
          git ls-remote --exit-code --heads origin bot/community-stats > /dev/null || result=$?
          if [ "$result" = 0 ]; then
            git fetch origin refs/heads/bot/community-stats
            git worktree add --detach "$RUNNER_TEMP/community-stats" FETCH_HEAD
          elif [ "$result" = 2 ]; then
            git worktree add --detach "$RUNNER_TEMP/community-stats" HEAD
          else
            exit "$result"
          fi

      - name: Collect weekly stats
        run: |
          # 実行するコードは最新 develop、データとコミット親は保存用ブランチ。
          uv run --frozen python tools/community/collect_weekly_stats.py \
            --out-dir "$RUNNER_TEMP/community-stats/data/community_weekly"

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/community-stats"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find data/community_weekly -maxdepth 1 -name '*.tsv' -type f -print0 |
            xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "chore(community): 週ごとの再生回数・お気に入り数を写し取り ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          # 保存済みデータを消す force push はしない。競合時は失敗として通知する。
          git push origin HEAD:refs/heads/bot/community-stats
