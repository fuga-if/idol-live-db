name: core-guard

# 共有コア (imas-core) のテスト。
# ここには「同梱 DB のスキーマが台帳どおりか」の突き合わせも入っている
# (schema_registry)。iOS/Android のどちらか片方にだけスキーマ変更を入れた事故を
# ここで捕まえるのが狙い。
on:
  pull_request:
    paths:
      - "imas-core/**"
      - "imas-text-fold/**"
      - "web/wasm/imas-query-wasm/**"
      - "web/wasm/imas-sync-wasm/**"
      - "db/master.sql"
      # 下の Build master.sqlite の段で実行している (壊れたら FK ゲートが黙って外れる)
      - "tools/build_db.sh"
      - "tools/check_fk_integrity.py"
      - "ImasLiveDB-Android/app/schemas/**"
      - ".github/workflows/core-guard.yml"
  push:
    branches: [develop, main]
    paths:
      - "imas-core/**"
      - "imas-text-fold/**"
      - "web/wasm/imas-query-wasm/**"
      - "web/wasm/imas-sync-wasm/**"
      - "db/master.sql"
      - "tools/build_db.sh"
      - "tools/check_fk_integrity.py"
      - "ImasLiveDB-Android/app/schemas/**"
      - ".github/workflows/core-guard.yml"

# GITHUB_TOKEN は既定で読み取りのみ (書き込みが要るジョブは個別に足す)。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            imas-core/target
            imas-text-fold/target
            web/wasm/imas-query-wasm/target
            web/wasm/imas-sync-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('imas-core/Cargo.lock', 'imas-text-fold/Cargo.lock', 'web/wasm/imas-query-wasm/Cargo.lock', 'web/wasm/imas-sync-wasm/Cargo.lock') }}

      # テストは同梱 master.sqlite を読む (スキーマ突き合わせ・実データ照合)。
      # gitignore 対象なので db/master.sql から作る。
      - name: Build master.sqlite from db/master.sql
        run: bash tools/build_db.sh

      - name: Test
        working-directory: imas-core
        run: cargo test --locked

      # agent feature は既定 off なので、これを足さないと src/agent/** と
      # bin/imas-mcp が CI で 1 度もコンパイルされない (壊れても緑のまま)。
      - name: Test (agent feature)
        working-directory: imas-core
        run: cargo test --locked --features agent

      # 畳み込み規則と一覧の絞り込み wasm は、imas-core とは別の Cargo プロジェクト。
      # 上の cargo test には入らないので、ここで個別に走らせる。
      - name: Test (imas-text-fold)
        run: cargo test --locked --manifest-path imas-text-fold/Cargo.toml

      # 同梱 master.sqlite を読む (上の Build master.sqlite の段で作ったもの)。
      - name: Test (imas-query-wasm)
        run: cargo test --locked --manifest-path web/wasm/imas-query-wasm/Cargo.toml

      # CloudKit の公開データを表に写す部品 (docs/ARCHITECTURE-mirror.md)。同梱 master.sqlite を読む。
      - name: Test (imas-sync-wasm)
        run: cargo test --locked --manifest-path web/wasm/imas-sync-wasm/Cargo.toml

      # wasm としてビルドできること (agent feature の道具が wasm で落ちないか。ホスト向けのテストでは見えない)。
      - name: Build (imas-sync-wasm, wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path web/wasm/imas-sync-wasm/Cargo.toml

      # 利用者に渡す TS の型 (web/wasm/imas-sync-wasm/types/) は ts-rs の生成物。Rust の型を変えて再生成し忘れたら落とす。
      - name: Types are up to date (imas-sync-wasm)
        working-directory: imas-core
        run: |
          cargo test --locked --features web-export --lib export_bindings
          git diff --exit-code -- ../web/wasm/imas-sync-wasm/types
