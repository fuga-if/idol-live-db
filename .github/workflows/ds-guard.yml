name: Design System Guard

# 画面のコードに色・文字の大きさ・余白・角丸の数字や形を直接書いていないかを見る
# (docs/DESIGN_SYSTEM.md §15。iOS と Android)。今ある手書きは tools/ds_usage_baseline.tsv に載せてあり、
# 増えたときだけ落とす。減らしたら `bash tools/check_ds_usage.sh --update` で基準を下げる。
on:
  push:
    branches: [main, develop]
    paths:
      - 'ImasLiveDB/Views/**'
      - 'ImasLiveDB/App/**'
      - 'ImasLiveDBWidget/**'
      - 'ImasLiveDB-Android/app/src/main/kotlin/**'
      - 'tools/check_ds_usage.sh'
      - 'tools/ds_usage_baseline.tsv'
  pull_request:
    paths:
      - 'ImasLiveDB/Views/**'
      - 'ImasLiveDB/App/**'
      - 'ImasLiveDBWidget/**'
      - 'ImasLiveDB-Android/app/src/main/kotlin/**'
      - 'tools/check_ds_usage.sh'
      - 'tools/ds_usage_baseline.tsv'
  workflow_dispatch:

# GITHUB_TOKEN は既定で読み取りのみ (書き込みが要るジョブは個別に足す)。
permissions:
  contents: read

jobs:
  ds-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 手書きの見た目が増えていないか
        run: bash tools/check_ds_usage.sh
