name: web-deploy

# Web 出面 (ImasLiveDB Web) のビルド検証 + デプロイ。
#
# データの正は db/master.sql、表示ルールの正は imas-core (Rust)。
# ここでは (1) imas-core の web-export 機能をテスト → (2) db/master.sql から
# web/data/**.json を生成 → (3) 検索の畳み込み wasm をビルド → (4) Astro で
# 静的サイトをビルド → (5) Cloudflare Workers Static Assets へ deploy、を順に行う。
# PR では deploy を行わず、ビルド検証のみ。
#
# 既存ワークフロー (core-guard / ios-guard / android-guard / worker-guard 等) には
# 一切触れない。imas-live-api/ の Worker とは別デプロイ (docs/ARCHITECTURE-web.md)。
#
# (2)(3) は `web/package.json` の `npm run export` / `npm run wasm` をそのまま呼ぶ
# (Simplifier 指摘 Altitude-11: CI が同じコマンドを別の綴りで YAML に書き直すと、
# `--locked` の有無や出力先のような差分が 2 箇所で個別にずれる)。
on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - "imas-core/**"
      - "imas-text-fold/**"
      - "db/master.sql"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    # push 側と揃える (Simplifier 指摘 Simpl C-14): db/master.sql だけを直す PR で
    # ビルド検証が走らない片手落ちを防ぐ。挙動変化あり (PR で走るジョブが増える)。
    paths:
      - "web/**"
      - "imas-core/**"
      - "imas-text-fold/**"
      - "db/master.sql"
      - ".github/workflows/web-deploy.yml"
  schedule:
    # 毎日 20:00 UTC = JST 05:00。データが動かない日でも「今日」(todayJst) を進め、
    # 開催済み/今後の分類を最新に保つ (imas-core の jst_day::jst_today がビルド時に
    # 1 回だけ確定する設計。docs/ARCHITECTURE-web.md 参照)。
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      # `~/.cargo/registry` を丸ごとキャッシュすると展開済みの registry/src/ まで
      # 入り容量・復元時間が膨らむので index/cache に絞る。restore-keys が無いと
      # Cargo.lock が 1 バイト動いた瞬間に完全キャッシュミスして依存全体を
      # コールドビルドし直すので、プレフィックス一致の復元先を足す
      # (Simplifier 指摘 Eff-11)。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            ~/.cargo/bin
            imas-core/target
            web/wasm/imas-fold-wasm/target
          key: web-cargo-${{ runner.os }}-${{ hashFiles('imas-core/Cargo.lock', 'web/wasm/imas-fold-wasm/Cargo.lock') }}
          restore-keys: |
            web-cargo-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # cargo export (npm run export) より前に上げる (Simplifier 指摘 Altitude-11)。
      # 以降の cargo/wasm-pack 呼び出しは npm script 経由に統一する。
      - name: npm ci
        working-directory: web
        run: npm ci

      # web-export の serde 構造体のテストは同梱 master.sqlite を読む
      # (imas-core の既存テスト流儀に合わせる。core-guard.yml と同じ手順)。
      - name: Build master.sqlite from db/master.sql
        run: bash tools/build_db.sh

      - name: Rust tests (web-export)
        working-directory: imas-core
        run: cargo test --locked --features web-export

      # ts-rs が生成する TS 型 (web/src/lib/schema/**) は commit 済みのものが正。
      # 生成先が空のまま `git diff --exit-code` を通すと「差分ゼロ」で誤って緑になるため、
      # ドリフト検査の前にファイルが実在することを別ステップで確認する。
      - name: Ensure generated schema exists
        run: |
          if [ -z "$(ls web/src/lib/schema/*.ts 2>/dev/null)" ]; then
            echo "::error::web/src/lib/schema/*.ts が無い (cargo test --features web-export で生成され commit されているはず)"
            exit 1
          fi

      # `git diff --exit-code` は「追跡済みファイルの変更」しか見ないため、ts-rs が
      # 新しい DTO を追加して *未追跡の* .ts ファイルが増えたケースを素通ししてしまう
      # (RedTeam 指摘 H-5)。一旦 add してからステージ済み差分を見ることで、新規/変更/削除
      # のいずれも確実に検出する。
      - name: Schema drift check
        run: |
          git add -A -- web/src/lib/schema
          git diff --cached --exit-code -- web/src/lib/schema

      # web/package.json の "export" スクリプトをそのまま呼ぶ (cargo のコマンド文字列を
      # ここに再掲しない)。CI 専用の --locked は package.json 側に付与されている。
      - name: Export JSON from db/master.sql
        working-directory: web
        run: npm run export

      # ソースからのビルド (cargo install wasm-pack) は依存ツリーが大きくキャッシュミス時に
      # 数分かかる。プリビルドバイナリを取得する (Simplifier 指摘 Eff-12)。
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # web/package.json の "wasm" スクリプトをそのまま呼ぶ (出力先 ../../src/lib/fold の
      # 綴りを 2 箇所に持たない)。
      - name: Build fold wasm
        working-directory: web
        run: npm run wasm

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Unit tests (fold parity / fixture schema)
        working-directory: web
        run: npm test

      - name: Build site
        working-directory: web
        run: npm run build # astro build (prebuild が require-data.mjs) + check-limits.mjs

      - name: Deploy to Cloudflare
        if: >-
          github.event_name != 'pull_request' && env.HAS_CF == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Skip notice
        if: >-
          github.event_name != 'pull_request' && env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未登録のためデプロイをスキップしました (docs/ARCHITECTURE-web.md の secret 設定手順を参照)"
