name: Lyrics request stats

# Logs の保持は 72 時間。全時間帯が残る直近 2 日だけを再取得する。
# bot/lyrics-stats は追記履歴を保持し、develop への取り込みを待たず蓄積する。
on:
  schedule:
    - cron: "17 1,7,13,19 * * *" # 6 時間おき。UTC の前日までを集計
  workflow_dispatch:
    inputs:
      days:
        description: "昨日から遡る日数 (既定 2)"
        required: false
        default: "2"

concurrency:
  group: lyrics-request-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false

      - name: Check secret
        env:
          CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_OBSERVABILITY_TOKEN" ]; then
            echo "::error::CLOUDFLARE_OBSERVABILITY_TOKEN が未登録。歌詞の利用回数を集計できない"
            exit 1
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Open stats archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --exit-code の 2 だけがブランチ未作成。通信・認証失敗を初回扱いしない。
          gh auth setup-git
          result=0
          git ls-remote --exit-code --heads origin bot/lyrics-stats > /dev/null || result=$?
          if [ "$result" = 0 ]; then
            git fetch origin refs/heads/bot/lyrics-stats
            git worktree add --detach "$RUNNER_TEMP/lyrics-stats" FETCH_HEAD
          elif [ "$result" = 2 ]; then
            git worktree add --detach "$RUNNER_TEMP/lyrics-stats" HEAD
          else
            exit "$result"
          fi

      - name: Collect lyrics_read logs
        env:
          CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
          DAYS: ${{ inputs.days || '2' }}
        run: |
          # 実行するコードは最新 develop、データとコミット親は保存用ブランチ。
          uv run --frozen python tools/lyrics/collect_request_logs.py \
            --days "$DAYS" --out-dir "$RUNNER_TEMP/lyrics-stats/data/lyrics_requests"

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/lyrics-stats"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 新規ファイルも先に stage し、空ファイルだけの日も確実に保存する。
          find data/lyrics_requests -maxdepth 1 -name '*.tsv' -type f -print0 |
            xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "chore(jasrac): 歌詞リクエスト回数を集計 ($(date -u +%Y-%m-%d))"
          # 保存済みデータを消す force push はしない。競合時は失敗として通知する。
          git push origin HEAD:refs/heads/bot/lyrics-stats
