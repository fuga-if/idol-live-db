name: Data API Guard

# 公開データ API (imas-data-api) の検証。デプロイと D1 への書き込みはしない
# (オーナーの手元操作。docs/ARCHITECTURE-data-api.md §8)。secret は使わない。
on:
  push:
    branches: [main, develop]
    paths:
      - 'imas-data-api/**'
      - 'imas-core/src/agent/**'
      - 'imas-core/src/web_export/data_api.rs'
      - 'web/wasm/imas-fold-wasm/**'
      - 'imas-text-fold/**'
      - 'db/master.sql'
      - '.github/workflows/data-api-guard.yml'
  pull_request:
    paths:
      - 'imas-data-api/**'
      - 'imas-core/src/agent/**'
      - 'imas-core/src/web_export/data_api.rs'
      - 'web/wasm/imas-fold-wasm/**'
      - 'imas-text-fold/**'
      - 'db/master.sql'
      - '.github/workflows/data-api-guard.yml'
  workflow_dispatch:

# GITHUB_TOKEN は既定で読み取りのみ (書き込みが要るジョブは個別に足す)。
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Rust tests (文書・SQL)
        working-directory: imas-core
        run: |
          cargo test --locked --lib --features web-export data_api
          cargo test --locked --lib publish
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: imas-data-api/package-lock.json
      - name: Install wasm-pack
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-pack
      - name: npm ci
        working-directory: imas-data-api
        run: npm ci
      - name: Build fold wasm
        working-directory: imas-data-api
        run: npm run wasm
      - name: Type check
        working-directory: imas-data-api
        run: npm run check
      - name: Unit tests (実行計画・ルーティング)
        working-directory: imas-data-api
        run: npm test
      - name: Bundle check (deploy しない)
        working-directory: imas-data-api
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry"
