name: Worker Guard

# imas-live-api (Cloudflare Worker) の型チェック・テスト・バンドル検証。
# wrangler は esbuild で型を無視してバンドルするため、型エラーはデプロイまで
# 気付けない。tsc --noEmit を CI に置いて、壊れた型のまま develop/main に
# 入らないようにする。
#
# ⚠️ secret は一切使わない。deploy --dry-run はバンドルまでで実際の公開はしない
#    (デプロイはオーナーの手元操作)。
on:
  push:
    branches: [main, develop]
    paths:
      - 'imas-live-api/**'
      - '.github/workflows/worker-guard.yml'
  pull_request:
    paths:
      - 'imas-live-api/**'
      - '.github/workflows/worker-guard.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imas-live-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: imas-live-api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # vitest (Workers ランタイム上)。型が通っても契約は壊れうる —
      # 特に GET /calls/dashboard は「応答にも発行 SQL にも歌詞の断片を出さない」ことを
      # テストでしか担保できない (test/calls_dashboard.test.ts)。
      - name: Test
        run: npm test

      # バンドルできることまで確認する (import 漏れ・構文エラーの検出)。
      # --dry-run なので Cloudflare へは何も送らない。
      - name: Bundle check
        run: npx wrangler deploy --dry-run
