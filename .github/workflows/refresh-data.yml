name: Refresh master data

# CloudKit (source of truth) → db/master.sql を日次でエクスポートし、
# 変化があれば bot/data-refresh に保存する。コントリビューターが常に最新データに対して
# tools/apply_data.py --check を回せるようにする。
#
# 取り出し・検査・保存は別のジョブにしてある:
#   - export: 鍵を持ち、CloudKit から取り出して artifact に置くだけ (contents: read)。
#   - check : 鍵を持たない。取り出した db/master.sql で FK ゲート (tools/build_db.sh) を回し、
#             落ちたらワークフローを赤くして、違反の一覧を job summary に出す。
#   - save  : 鍵を持たない (contents: write)。check が緑なら bot/data-refresh、赤なら
#             bot/data-refresh-broken に push する。検査に落ちた写しも保存はする
#             (以前は保存もしなかったので、git 上の写しが何日も古いまま止まった) が、
#             オーナーが PR にする bot/data-refresh には載せない。GITHUB_TOKEN の push では
#             PR の core-guard が走らないので、壊れた写しを PR の head にしないため。
#   3 つのジョブは export が出した db/master.sql の sha256 で同じものか確かめる。
#
# ⚠️ セキュリティ前提 (設定は docs/DATA_PIPELINE.md 参照):
#   - CloudKit 鍵は environment "cloudkit" の secret に置き、deployment branch を
#     main と develop に絞る → feature ブランチ / PR で走る他ワークフローからは鍵を取得できない
#     (schedule はリポジトリの既定ブランチ develop にあるこのファイルで起動する。
#     workflow_dispatch も、鍵を使えるのは main / develop から起動したときだけ)
#   - 鍵を使うのは export ジョブだけ。check ジョブは secret を使わない
#   - develop / main の branch protection + .github/ の CODEOWNERS でワークフロー改ざんを防ぐ
#     (schedule が読むのは develop のこのファイルなので、develop の保護が要)

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST
  workflow_dispatch: {}

# 同時実行を1本に
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment: cloudkit          # ← 鍵を置いた environment secret を使う
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 鍵を扱うジョブなので、入れるものの版を固定する。
      - name: Install deps
        run: pip install requests==2.32.5 ecdsa==0.19.2

      - name: Write CloudKit key
        env:
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: |
          printf '%s' "$CLOUDKIT_PRIVATE_KEY" > tools/eckey.pem

      - name: Export CloudKit → db/master.sql
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
        run: |
          python3 tools/export_cloudkit.py --production --key-file tools/eckey.pem

      - name: Remove CloudKit key
        if: always()
        run: rm -f tools/eckey.pem

      - name: Digest
        id: digest
        run: echo "sha256=$(sha256sum db/master.sql | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the export to the check and save jobs
        uses: actions/upload-artifact@v4
        with:
          name: master-sql
          path: db/master.sql
          retention-days: 7

  check:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: master-sql
          path: db

      - name: Verify the artifact is the export
        env:
          EXPECTED: ${{ needs.export.outputs.sha256 }}
        run: echo "$EXPECTED  db/master.sql" | sha256sum --check

      # 同梱される master.sqlite を生成し、外部キー整合性を検証する。
      # FK 違反があると初回起動 reseed が全ロールバックし、ユーザーに無言で旧データが残る。
      - name: FK integrity gate
        run: bash tools/build_db.sh

      # build_db.sh は落ちると DB を消すので、一覧は別の一時 DB で取り直す。
      - name: List the violations in the job summary
        if: failure()
        run: |
          sqlite3 "$RUNNER_TEMP/check.sqlite" < db/master.sql
          {
            echo '## db/master.sql の検査に落ちた'
            echo 'bot/data-refresh-broken に保存した (bot/data-refresh には載せない)。CloudKit 側を直してから取り込む。'
            echo '```'
            python3 tools/check_fk_integrity.py "$RUNNER_TEMP/check.sqlite" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  save:
    needs: [export, check]
    if: always() && needs.export.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write              # bot ブランチへの push に必要
    steps:
      # main / develop はどちらも保護ブランチ (PR+オーナー承認必須) なので bot は直接 push できない。
      # bot 専用ブランチに出し、オーナーが bot/data-refresh → develop の PR でレビュー&マージする。
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: master-sql
          path: db

      - name: Verify the artifact is the export
        env:
          EXPECTED: ${{ needs.export.outputs.sha256 }}
        run: echo "$EXPECTED  db/master.sql" | sha256sum --check

      - name: Push to the bot branch if changed
        env:
          BRANCH: ${{ needs.check.result == 'success' && 'bot/data-refresh' || 'bot/data-refresh-broken' }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- db/master.sql; then
            echo "変化なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/master.sql
          git commit -m "chore(data): refresh db/master.sql ($(date -u +%Y-%m-%d))"
          # checkout で資格情報を残していないので、push のときだけ token を渡す。
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
          echo "::notice::${BRANCH} に保存した"

  # 検査 (check) を通った日だけ、export の db/master.sql を公開データ API の D1 に全置き換えで流す。
  # 落ちた日は流さない (壊れたデータを公開しない)。develop の db/master.sql は PR で入るまで古いので、
  # 入力は develop ではなく export の artifact そのもの。
  #   - Cloudflare の資格情報は environment "cloudflare" の secret (CLOUDFLARE_API_TOKEN /
  #     CLOUDFLARE_ACCOUNT_ID)。無ければ全ステップを飛ばす (失敗にしない)。
  #   - CloudKit の鍵は使わない。D1 の書き込みは約 4 万行 (無料枠 10 万行/日) なので 1 日 1 回 + 手動 1 回まで。
  #   - 設定は docs/DATA_PIPELINE.md「公開データ API への同期」。
  sync-data-api:
    needs: [export, check]
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::environment cloudflare に CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が無いので、公開データ API への同期は飛ばした"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: master-sql
          path: db

      - name: Verify the artifact is the export
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ needs.export.outputs.sha256 }}
        run: echo "$EXPECTED  db/master.sql" | sha256sum --check

      # Cloudflare のトークンを持つジョブなので、第三者の action を増やさず rustup で入れる (他のガードと同じ)。
      - name: Install Rust
        if: steps.gate.outputs.enabled == 'true'
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install wrangler
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci --prefix imas-data-api

      # master.sql → imas-core web-export --api-sql → wrangler d1 execute --remote (全置き換え)。
      # meta.version は「日付 + 組んだ SQL の内容ハッシュ」なので、中身が変わればキャッシュ鍵が切り替わる。
      - name: Sync to D1 imas-master-db
        if: steps.gate.outputs.enabled == 'true'
        run: python3 tools/sync_master_d1.py --remote --yes --master-sql db/master.sql

      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          SHA: ${{ needs.export.outputs.sha256 }}
        run: |
          {
            echo '## 公開データ API の D1 を更新した'
            echo "入力: CloudKit の書き出し (sha256 \`$SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"
