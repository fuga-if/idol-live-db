[package]
name = "imas-core"
version = "0.1.0"
edition = "2021"
description = "ImasLiveDB の共有ドメインコア (iOS / Android 共通ロジック)"

[lib]
name = "imas_core"
# staticlib: iOS xcframework 用 / cdylib: Android .so + バインディング生成用
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.0", features = ["cli"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# タイトル/ID 比較を Swift の String == (Unicode 正準等価) に合わせるための NFC 正規化
unicode-normalization = "0.1.25"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"

[profile.release]
# FFI 境界を跨ぐ薄い層なので LTO でバイナリを絞る
lto = true
codegen-units = 1
