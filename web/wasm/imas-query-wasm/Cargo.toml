[package]
name = "imas-query-wasm"
version = "0.1.0"
edition = "2021"
description = "一覧の絞り込み・並べ替えをブラウザで行うための wasm ラッパ"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 規則の実体。**ここには絞り込みも並び順も 1 行も書かない。**
# wasm では outbound (SQLite) と inbound (uniffi) が cfg で外れ、domain だけが載る。
imas-core = { path = "../../../imas-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# fold と違い実際に計算する側なので、大きさより速さを取る。
opt-level = 3
lto = true
codegen-units = 1
