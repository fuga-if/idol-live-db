[versions]
# Custom Tabs (Apple Music のサインイン)。1.9 以降は core/activity/stdlib を持ち上げるので 1.8.0。
browser = "1.8.0"
# MusicKit for Android の認証 AAR が AppCompat のテーマを参照する (使わない画面だが資源の解決に要る)。
appcompat = "1.7.0"
# SDK
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# Build tools
agp = "8.9.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

# AndroidX Core
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"

# Compose
composeBom = "2025.01.01"

# Navigation
navigationCompose = "2.8.6"

# Room
room = "2.6.1"

# Image loading
coil = "3.1.0"

# Media
media3 = "1.5.1"

# Auth (Google Sign-In / Credential Manager)
credentials = "1.3.0"
googleid = "1.1.1"
securityCrypto = "1.1.0-alpha06"

# imas-core (Rust) の UniFFI バインディングが要求する JNA
jna = "5.17.0"

# Room DAO を JVM ユニットテストから叩くための Android フレームワークシム
robolectric = "4.16"

# 浮いている枠のガラス (ぼかし)。1.5.4 が compose-ui の下限を 1.7.3 に止める最後の版
# (1.6.0 以降は 1.8.0 を要求し、この BOM の compose-ui より新しくなって版がずれる)。
haze = "1.5.4"

# P名刺: 近くの Android どうしの受け渡し (iOS の MultipeerConnectivity の対)
playServicesNearby = "19.3.0"
# P名刺: QR を読むカメラ (CameraX) と、端末内で動く QR の読み取り (圏外でも動く bundled モデル)
camerax = "1.4.1"
mlkitBarcode = "17.3.0"
# P名刺: 紙の名刺を撮る (名刺の形に切り抜く。iOS の書類カメラの対)
mlkitDocumentScanner = "16.0.0-beta1"
# P名刺: QR を刷る (誤り訂正 L。iOS の CIQRCodeGenerator の対)
zxing = "3.5.3"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
# JNA: @aar は実機/エミュ用、素の jar は JVM ユニットテスト用
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Activity
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# テスト専用。Room の移行 (MigrationTestHelper) を JVM ユニットテストで検証する
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Media3
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Auth (Google Sign-In / Credential Manager)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# 浮いている枠のガラス (ぼかし)
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

# P名刺
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "playServicesNearby" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Test
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
